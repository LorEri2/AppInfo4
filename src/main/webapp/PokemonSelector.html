<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choix de pokemon</title>
</head>
<body>
<h2>Choisissez vos Pokémon</h2>

<form action="PokemonReceiver" method="post">
    <div>
        <input type="checkbox" id="pikachu" name="pokemon" value="Pikachu">
        <label for="pikachu">Pikachu</label>
    </div>
    <div>
        <input type="checkbox" id="bulbizarre" name="pokemon" value="Bulbizarre">
        <label for="bulbizarre">Bulbizarre</label>
    </div>
    <div>
        <input type="checkbox" id="salameche" name="pokemon" value="Salamèche">
        <label for="salameche">Salamèche</label>
    </div>
    <div>
        <input type="checkbox" id="carapuce" name="pokemon" value="Carapuce">
        <label for="carapuce">Carapuce</label>
    </div>
    <div>
        <input type="checkbox" id="evoli" name="pokemon" value="Evoli">
        <label for="evoli">Évoli</label>
    </div>

    <br>
    <button type="submit">Envoyer</button>
</form>
</body>
</html>
